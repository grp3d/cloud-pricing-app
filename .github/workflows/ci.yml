name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: cloud_pricing_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # tests/conftest.py reads TEST_DATABASE_URL (not DATABASE_URL) and its default has no
      # user, so without it the runner's OS user ("runner") is used and doesn't exist.
      DATABASE_URL: postgresql+psycopg://postgres@localhost/cloud_pricing_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost/cloud_pricing_test
      # A small real subset of the upstream AWS pricing Parquet data, committed to the repo
      # (rebuild with backend/scripts/build_test_pricing_fixture.py).
      AWS_PRICING_PARQUET_DIR: ${{ github.workspace }}/backend/tests/fixtures/pricing_parquet
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev
        working-directory: backend
      - run: uv run ruff check src/
        working-directory: backend
      - run: |
          uv run alembic upgrade head
          uv run pytest -v
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  api-contract-drift:
    # Constitution Principle IV: fail the build if the frontend's generated API types drift
    # from the backend's live OpenAPI schema — a real gate, not advisory. Runs the actual
    # backend (migrated against an ephemeral Postgres) so /openapi.json reflects real code.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: uv sync --extra dev
        working-directory: backend
      - run: uv run alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres@localhost/postgres
      - name: Start backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres@localhost/postgres
        run: |
          uv run uvicorn src.main:app --port 8000 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done
      - run: npm install
        working-directory: frontend
      - run: npm run check-api-types
        working-directory: frontend
