name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev
        working-directory: backend
      - run: uv run ruff check src/
        working-directory: backend
      # Contract/integration tests need the real AWS pricing Parquet fixture data, which lives
      # outside this repo (produced by a separate upstream project) — CI runs the DB-independent
      # unit suite only. Contract/integration tests are run locally per backend/README.md.
      - run: |
          uv run alembic upgrade head
          uv run pytest tests/unit -v
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres@localhost/postgres

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  api-contract-drift:
    # Constitution Principle IV: fail the build if the frontend's generated API types drift
    # from the backend's live OpenAPI schema — a real gate, not advisory. Runs the actual
    # backend (migrated against an ephemeral Postgres) so /openapi.json reflects real code.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: uv sync --extra dev
        working-directory: backend
      - run: uv run alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres@localhost/postgres
      - name: Start backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres@localhost/postgres
        run: |
          uv run uvicorn src.main:app --port 8000 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done
      - run: npm install
        working-directory: frontend
      - run: npm run check-api-types
        working-directory: frontend
