[project]
name = "cloud-pricing-backend"
version = "0.1.0"
description = "AWS Architecture Assembly & Pricing backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "duckdb>=1.1",
    "psycopg[binary]>=3.2",
    "greenlet>=3.1",
    "structlog>=26.1",
    "boto3>=1.40",
    # 023-agent-foundation (research R2, R14): the hosted model client, and HTTP for the local
    # (Ollama) model client.
    "anthropic>=0.70",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "jsonschema>=4.23",
    # 023 (research R8): evaluation cases are YAML.
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 023 (research R8): live-model evaluations are opt-in (`pytest -m live_model`).
addopts = "-m 'not live_model'"
markers = ["live_model: runs agent evaluations against real models (opt-in)"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["src/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
# str+Enum (not StrEnum) is the standard FastAPI/Pydantic v2 pattern for enums that must also
# serialize as plain JSON strings in the OpenAPI schema — deliberate, not a migration target.
ignore = ["E501", "UP042"]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]
