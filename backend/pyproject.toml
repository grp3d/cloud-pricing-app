[project]
name = "cloud-pricing-backend"
version = "0.1.0"
description = "AWS Architecture Assembly & Pricing backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "duckdb>=1.1",
    "psycopg[binary]>=3.2",
    "greenlet>=3.1",
    "structlog>=26.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# str+Enum (not StrEnum) is the standard FastAPI/Pydantic v2 pattern for enums that must also
# serialize as plain JSON strings in the OpenAPI schema — deliberate, not a migration target.
ignore = ["UP042"]
